			<p>
				Like every good juggling festival, 
				the 1st Annual Berkeley Juggling Festival includes a public show.
			</p>

				to enjoy a wide range of performance genres and styles. You can bet that the Berkeley Festival 
				will be showcasing a few drops from the vast pool of talented performers that hang their hats 
				here in the beautiful Bay Area. Expect to see:
			</p>
			<span class="blockquote">

					<li>Unicycling</li>
					<li>Tumbling</li>

					<li>and of course some fantastic technical juggling!</li>
				</ul>
			</span>
			<p>
				The show will be &quot;family friendly&quot; and open to all ages.
